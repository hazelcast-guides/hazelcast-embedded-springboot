name: build
on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21', '25' ]
    name: Build with JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Tests
        run: mvn verify

